name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Claude Code release whose validator and test runner CI uses. Bump it
  # after updating Claude Code locally so CI and your own validate agree.
  CLAUDE_CODE_VERSION: 2.1.296
  DISABLE_AUTOUPDATER: "1"

jobs:
  # One job, so a run bills about one minute of the private repo's Actions quota.
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version-bump check diffs against the PR's base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g --no-audit --no-fund "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate, test, repo rules
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci.sh "$BASE"
